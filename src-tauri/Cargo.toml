[package]
name = "fst-desktop"
version = "1.0.38"
description = "App desktop do FST Beta em Rust (Tauri)"
authors = ["FST"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
tokio = { version = "1.0", features = ["full"] }
rdev = "0.5"
