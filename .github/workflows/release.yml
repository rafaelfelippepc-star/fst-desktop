name: Publicar versão

# Roda quando você envia uma tag começando com "v" (ex.: v1.0.25).
# Gera o instalador do Windows e publica na aba Releases; os apps instalados se atualizam sozinhos.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Usar o número da tag como versão do app
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#[vV]}"
          VERSION="${VERSION#.}"
          echo "Versão do app: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Conferir se há notas de novidades para esta versão (só avisa)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#[vV]}"
          VERSION="${VERSION#.}"
          node check-news.js "$VERSION"
      - name: Gerar o instalador (só gera, não publica)
        shell: bash
        run: |
          npx electron-builder --win --publish never
          echo "Arquivos gerados:"
          ls -la dist
          ls dist/*.exe >/dev/null || { echo "O instalador .exe não foi gerado"; exit 1; }
          test -f dist/latest.yml || { echo "O latest.yml não foi gerado"; exit 1; }
      - name: Enviar os arquivos para a Release (um por vez, com nova tentativa)
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "${TAG#[vV]}" --notes "$TAG"
          for f in dist/*.exe dist/*.blockmap dist/latest.yml; do
            [ -f "$f" ] || continue
            ok=0
            for i in 1 2 3; do
              echo "Enviando $f (tentativa $i de 3)"
              if gh release upload "$TAG" "$f" --clobber; then ok=1; break; fi
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "Não consegui enviar $f"; exit 1; }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Conferir se o .exe e o latest.yml chegaram na Release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | tee assets.txt
          grep -q '\.exe$' assets.txt || { echo "FALTOU o .exe na Release"; exit 1; }
          grep -q 'latest.yml' assets.txt || { echo "FALTOU o latest.yml na Release"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
